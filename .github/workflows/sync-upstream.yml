# Checks ralphtradesz/trading-hub (and the Workbench originals: FlowMap, aggr, Liquidity Mapper Fast) every 6 hours. When there are new commits, merges them into main (keeping this fork's
# changes: auto-update, build optimizations) and, if the merge is clean, builds and publishes new installers.
# On a merge conflict nothing is pushed: an issue is opened with the conflicting files.
#
# Run it right away: Actions → "Sincronizar con el original" → Run workflow.
name: Sincronizar con el original

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force_release:
        description: "Publicar instaladores aunque no haya cambios del original"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/ralphtradesz/trading-hub.git

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch upstream main --no-tags -q
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream ($(git rev-parse --short upstream/main))."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEW=$(git log --oneline HEAD..upstream/main)
          echo "New upstream commits:"; echo "$NEW"
          if git merge --no-edit -m "Merge upstream $(git rev-parse --short upstream/main) from ralphtradesz/trading-hub" upstream/main; then
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            FILES=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
            git merge --abort
            TITLE="Conflicto al sincronizar con ralphtradesz/trading-hub ($(git rev-parse --short upstream/main))"
            if ! gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' | grep -q .; then
              printf 'El original tiene cambios nuevos que chocan con los de esta copia, así que no se juntaron ni se publicó nada.\n\nArchivos en conflicto:\n%s\n\nCommits nuevos del original:\n```\n%s\n```\n\nPara resolverlo: `git fetch https://github.com/ralphtradesz/trading-hub main && git merge FETCH_HEAD`, arreglar los archivos y hacer push; después correr «Sincronizar con el original» o «Empaquetar y publicar».\n' "$FILES" "$NEW" > issue.md
              gh issue create --title "$TITLE" --body-file issue.md || true
            fi
            echo "::error::Merge conflict with upstream; see the issue."
            exit 1
          fi

  # los originales del Workbench (FlowMap, aggr, Liquidity Mapper Fast): si publicaron algo, se anota la versión nueva en
  # workbench/upstreams.json y se arma KVP con ella (si no compila, KVP sale igual con el Workbench anterior)
  workbench:
    needs: sync
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.up.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Versiones nuevas de los originales
        id: up
        run: |
          set -euo pipefail
          git pull -q --ff-only origin main || true
          python3 - <<'PY' > summary.txt
          import json, subprocess
          f = 'workbench/upstreams.json'
          d = json.load(open(f))
          changed = []
          for name, u in d.items():
              out = subprocess.run(['git', 'ls-remote', f"https://github.com/{u['repo']}.git", 'HEAD'], capture_output=True, text=True).stdout.split()
              if out and out[0] != u['sha']:
                  changed.append(f"{name} {u['sha'][:7]}→{out[0][:7]}")
                  u['sha'] = out[0]
          json.dump(d, open(f, 'w'), indent=2)
          open(f, 'a').write('\n')
          print(', '.join(changed))
          PY
          if [ -s summary.txt ] && ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "Workbench: originales nuevos ($(cat summary.txt))"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [sync, workbench]
    if: ${{ !cancelled() && (needs.sync.outputs.changed == 'true' || needs.workbench.outputs.changed == 'true' || inputs.force_release == true) }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
