# Builds the Windows installers (x64 + ARM64) and publishes them as a GitHub Release of this fork.
#
# Runs:
#   - by itself after "Sincronizar con el original" merges a new upstream version (workflow_call);
#   - when you push a tag like v1.2.0.3;
#   - by hand: Actions → "Empaquetar y publicar" → Run workflow.
#
# Version = upstream <Version> in Directory.Build.props + a fork build number (1.2.0 → 1.2.0.1, 1.2.0.2…).
# The app's updater (Settings → Updates) reads these releases.
name: Empaquetar y publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # El Workbench (lo que era VPFM): los módulos web de FlowMap, aggr y Liquidity Mapper Fast se compilan desde sus
  # originales (las versiones de workbench/upstreams.json, que «Sincronizar con el original» va actualizando), con la
  # traducción al chino y los módulos propios; y el motor del mapa de calor (servidor de FlowMap) con su runtime de
  # Python para Windows x64. Si un original cambió y algo no compila, KVP se publica igual sin el Workbench nuevo.
  workbench:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          path: kvp
          ref: ${{ github.ref_type == 'tag' && github.ref || 'main' }}

      - name: Versiones de los originales
        id: up
        run: |
          set -euo pipefail
          for m in flowmap aggr lmap; do
            echo "$m-repo=$(python -c "import json;print(json.load(open('kvp/workbench/upstreams.json'))['$m']['repo'])")" >> "$GITHUB_OUTPUT"
            echo "$m-sha=$(python -c "import json;print(json.load(open('kvp/workbench/upstreams.json'))['$m']['sha'])")" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.up.outputs.flowmap-repo }}
          ref: ${{ steps.up.outputs.flowmap-sha }}
          path: flowmap
          fetch-depth: 5
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.up.outputs.aggr-repo }}
          ref: ${{ steps.up.outputs.aggr-sha }}
          path: aggr
          fetch-depth: 5
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.up.outputs.lmap-repo }}
          ref: ${{ steps.up.outputs.lmap-sha }}
          path: lmap
          fetch-depth: 5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5

      - uses: actions/cache@v4
        with:
          path: |
            flowmap/client/node_modules
            aggr/node_modules
            lmap/node_modules
          key: kvp-wb-nm-${{ runner.os }}-${{ hashFiles('flowmap/client/package-lock.json', 'aggr/package-lock.json', 'lmap/package-lock.json') }}

      - name: Chino y motor del mapa de calor
        run: |
          set -o pipefail
          python kvp/workbench/zh-patch/apply.py flowmap 2.0.0 "${GITHUB_REPOSITORY}"
          python kvp/workbench/scripts/prepare_flowmap.py flowmap

      - name: FlowMap (mapa de calor)
        working-directory: flowmap/client
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          { [ -d node_modules ] || npm ci; } && npx vite build --base=/wb/flowmap/

      - name: aggr (operaciones agregadas)
        working-directory: aggr
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          set -o pipefail
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          printf '%s\n' 'VITE_APP_PROXY_URL=/api/wb/proxy/' 'VITE_APP_API_URL=' 'VITE_APP_LIB_URL=' \
            'VITE_APP_PUBLIC_VAPID_KEY=' 'VITE_APP_BASE_PATH=/wb/aggr/' > .env.production.local
          { [ -d node_modules ] || npm ci --no-audit --no-fund || npm install --no-audit --no-fund; } && npx vite build --base=/wb/aggr/
          python ../kvp/workbench/aggr/patch_aggr.py dist

      - name: Liquidity Mapper Fast (mapa de liquidez)
        working-directory: lmap
        env:
          HLM_SOURCEMAP: "off"
          MSYS_NO_PATHCONV: "1"
        run: |
          if grep -q "export const DEFAULT_THEME = 'light';" src/app/store.ts; then
            sed -i "s/export const DEFAULT_THEME = 'light';/export const DEFAULT_THEME = 'midnight';/" src/app/store.ts
          fi
          { [ -d node_modules ] || npm ci --no-audit --no-fund; } && npx vite build --config vite.config.mts

      - name: Juntar las páginas
        run: bash kvp/workbench/scripts/assemble.sh wbout flowmap aggr lmap

      - name: Runtime de Python con el servidor de FlowMap
        working-directory: flowmap
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash app/scripts/bundle-python.sh x86_64-pc-windows-msvc
          mkdir -p ../wbout/flowmap
          cp -r app/src-tauri/resources/pyruntime ../wbout/flowmap/pyruntime

      - name: Prueba del motor del mapa de calor
        run: |
          set -euo pipefail
          PY="$PWD/wbout/flowmap/pyruntime/python.exe"
          D="$(mktemp -d)"
          (cd "$D" && FLOWMAP_HOST=127.0.0.1 FLOWMAP_PORT=8799 FLOWMAP_RECORDING_ENABLED=0 FLOWMAP_DATA_DIR="$D" VPFM_WB_DIR="$PWD/wbout/wb" "$PY" -m flowmap_server) &
          SRV=$!
          for _ in $(seq 1 90); do curl -fsS http://127.0.0.1:8799/api/health 2>/dev/null | grep -q '"status":"ok"' && break; sleep 1; done
          curl -fsS http://127.0.0.1:8799/api/health
          kill "$SRV" || true

      - uses: actions/upload-artifact@v4
        with:
          name: workbench
          path: wbout
          retention-days: 3

  build:
    needs: workbench
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis

      - name: Version
        id: v
        run: |
          set -euo pipefail
          git fetch --tags --force -q
          BASE=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            N=$(git tag -l "v$BASE.*" | sed "s/^v$BASE\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
            VERSION="$BASE.$(( ${N:-0} + 1 ))"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # algunas pruebas de red del original dependen del tiempo y fallan de vez en cuando: un segundo intento
      - name: Tests
        run: dotnet test tests/TradingHub.Tests -c Release || dotnet test tests/TradingHub.Tests -c Release --no-build

      # la app tiene que abrir de verdad (un error al arrancar no lo ve ninguna prueba unitaria): se abre 20 s con una
      # pantalla virtual y una carpeta de datos vacía; si se cierra antes o deja crash.log, no se publica
      - name: Startup check
        run: |
          set -u
          sudo apt-get install -y -qq xvfb >/dev/null
          dotnet build src/TradingHub.App -c Release -v q
          H="$RUNNER_TEMP/th-home"; rm -rf "$H"; mkdir -p "$H/.config"
          set +e
          (cd "$H" && HOME="$H" XDG_CONFIG_HOME="$H/.config" timeout 20 xvfb-run -a -s "-screen 0 1600x1000x24" \
            dotnet "$GITHUB_WORKSPACE/src/TradingHub.App/bin/Release/net10.0/TradingHub.dll" > "$H/out.txt" 2>&1)
          code=$?
          set -e
          if [ "$code" != "124" ] || [ -f "$H/.config/KVP/crash.log" ]; then
            echo "::error::KVP no arranca (salió con $code)"
            tail -40 "$H/out.txt"; cat "$H/.config/KVP/crash.log" 2>/dev/null || true
            exit 1
          fi
          echo "Arranca bien"

      # el Workbench armado en Windows (si salió bien): páginas para los dos instaladores, motor del mapa de calor para x64
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: workbench
          path: workbench-dist

      - name: Installers
        run: |
          [ -f workbench-dist/wb/index.html ] && echo "Workbench: $(du -sh workbench-dist | cut -f1)" || echo "::warning::Sin Workbench en esta versión"
          bash scripts/build-release.sh "${{ steps.v.outputs.version }}"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          UP=$(git rev-parse --short "${{ steps.v.outputs.sha }}")
          cat > notes.md <<EOF
          KVP $V para Windows (basada en la ${{ steps.v.outputs.base }} de [ralphtradesz/trading-hub](https://github.com/ralphtradesz/trading-hub), commit $UP).

          - **KVP-Setup-x64.exe**: PC con Intel o AMD (la mayoría).
          - **KVP-Setup-arm64.exe**: Windows en ARM.
          - Los `TradingHub-Setup-*.exe` son el mismo instalador con el nombre anterior (para que las Trading Hub ya instaladas se actualicen a KVP).

          Si ya la tenés, KVP te avisa sola (Ajustes → Actualizaciones) y se actualiza sin tocar tus datos.
          EOF
          sed -i 's/^          //' notes.md
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/*.exe dist/*.sha256 --clobber
          else
            gh release create "v$V" dist/*.exe dist/*.sha256 --target "${{ steps.v.outputs.sha }}" \
              --title "KVP $V" --notes-file notes.md --latest
          fi
