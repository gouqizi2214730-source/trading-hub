# Builds the Windows installers (x64 + ARM64) and publishes them as a GitHub Release of this fork.
#
# Runs:
#   - by itself after "Sincronizar con el original" merges a new upstream version (workflow_call);
#   - when you push a tag like v1.2.0.3;
#   - by hand: Actions → "Empaquetar y publicar" → Run workflow.
#
# Version = upstream <Version> in Directory.Build.props + a fork build number (1.2.0 → 1.2.0.1, 1.2.0.2…).
# The app's updater (Settings → Updates) reads these releases.
name: Empaquetar y publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis

      - name: Version
        id: v
        run: |
          set -euo pipefail
          git fetch --tags --force -q
          BASE=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            N=$(git tag -l "v$BASE.*" | sed "s/^v$BASE\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
            VERSION="$BASE.$(( ${N:-0} + 1 ))"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Tests
        run: dotnet test tests/TradingHub.Tests -c Release

      - name: Installers
        run: bash scripts/build-release.sh "${{ steps.v.outputs.version }}"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          UP=$(git rev-parse --short "${{ steps.v.outputs.sha }}")
          cat > notes.md <<EOF
          Trading Hub $V para Windows (basada en la ${{ steps.v.outputs.base }} de [ralphtradesz/trading-hub](https://github.com/ralphtradesz/trading-hub), commit $UP).

          - **TradingHub-Setup-x64.exe**: PC con Intel o AMD (la mayoría).
          - **TradingHub-Setup-arm64.exe**: Windows en ARM.

          Si ya la tenés, Trading Hub te avisa sola (Ajustes → Actualizaciones) y se actualiza sin tocar tus datos.
          EOF
          sed -i 's/^          //' notes.md
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/*.exe dist/*.sha256 --clobber
          else
            gh release create "v$V" dist/*.exe dist/*.sha256 --target "${{ steps.v.outputs.sha }}" \
              --title "Trading Hub $V" --notes-file notes.md --latest
          fi
